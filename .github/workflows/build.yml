name: build

# Every push (any branch) and every pull request builds with SourceMod 1.12
# and 1.13 and packs the packages exactly as a release does (1.12); they are
# kept as a workflow artifact for 7 days. Nothing is published then: no tag,
# no GitHub release, no semantic-release.
#
# A release is only made by hand: Actions -> build -> Run workflow on main
# with "release" ticked, or `gh workflow run build.yml --ref main -f
# release=true`. The build job runs first; only when it passed does
# semantic-release read the Conventional Commits since the last tag: for a
# feat, fix or breaking change it bumps the version files, writes
# CHANGELOG.md, commits that as "chore(release): vX.Y.Z [skip ci]", tags
# vX.Y.Z and creates the GitHub release as a draft. publish then builds that
# tag with SourceMod 1.12 (stable), adds the packages to the draft and only
# then publishes it, so a release never shows up without its files (a failed
# publish leaves the draft: re-run the failed job). docs, chore, ci etc. make
# no release.
on:
  push:
    # every branch except Dependabot's: its pull request builds them anyway
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (semantic-release, tag, GitHub release with the packages)
        type: boolean
        default: false

# A newer push or pull request update cancels the older check run; manual
# runs (and so releases) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

# The compilers: fixed builds, so a release is not built with whatever is
# newest on the download server. A new build is a commit that changes these.
# The checksums are our own (AlliedModders publishes none).
env:
  SM_1_12: sourcemod-1.12.0-git7260-linux.tar.gz
  SM_1_12_SHA256: b01719e6143bc7d5bb63aae8086d031574da6ef838f041ba4b8ab72c8c75b888
  SM_1_13: sourcemod-1.13.0-git7484-linux.tar.gz
  SM_1_13_SHA256: 2f7309c9dbb17158516bf3daa87af7a473f37d4838f7d0f3738b1b5bf87b455c

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sourcemod: ['1.12', '1.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags, for the version
      - name: install SourceMod ${{ matrix.sourcemod }}
        run: |
          sm_file=${{ matrix.sourcemod == '1.12' && env.SM_1_12 || env.SM_1_13 }}
          sm_sha=${{ matrix.sourcemod == '1.12' && env.SM_1_12_SHA256 || env.SM_1_13_SHA256 }}
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -fsSL "https://sm.alliedmods.net/smdrop/${{ matrix.sourcemod }}/$sm_file" -o "$RUNNER_TEMP/sm.tar.gz"
          echo "$sm_sha  $RUNNER_TEMP/sm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sm.tar.gz" -C "$RUNNER_TEMP/sourcemod"
          scripting="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
          if [ -x "$scripting/spcomp64" ]; then spcomp="$scripting/spcomp64"; else spcomp="$scripting/spcomp"; fi
          echo "using $sm_file ($spcomp)"
          echo "SPCOMP=$spcomp" >> "$GITHUB_ENV"
          echo "SM_INCLUDE=$scripting/include" >> "$GITHUB_ENV"
      - name: make package
        run: make package SPCOMP="$SPCOMP" SM_INCLUDE="$SM_INCLUDE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.sourcemod == '1.12'
        with:
          name: gamewe-sourcemod
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tar.gz.sha256
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: releases only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release can only be made from main, not from $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # semantic-release and its plugins as pinned in tools/release/package-lock.json
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          tools/release/node_modules/.bin/semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - name: install SourceMod 1.12
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/$SM_1_12" -o "$RUNNER_TEMP/sm.tar.gz"
          echo "$SM_1_12_SHA256  $RUNNER_TEMP/sm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sm.tar.gz" -C "$RUNNER_TEMP/sourcemod"
          scripting="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
          if [ -x "$scripting/spcomp64" ]; then spcomp="$scripting/spcomp64"; else spcomp="$scripting/spcomp"; fi
          echo "SPCOMP=$spcomp" >> "$GITHUB_ENV"
          echo "SM_INCLUDE=$scripting/include" >> "$GITHUB_ENV"
      - name: make package
        run: make package SPCOMP="$SPCOMP" SM_INCLUDE="$SM_INCLUDE"
      - name: add the packages to the draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE" dist/*.tar.gz dist/*.zip dist/*.tar.gz.sha256 dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$RELEASE" --draft=false --latest --repo "$GITHUB_REPOSITORY"
