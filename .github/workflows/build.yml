name: build

# Every push to main builds with SourceMod 1.12 and 1.13 and keeps the
# packages as a workflow artifact. semantic-release then reads the
# Conventional Commits since the last tag: for a feat, fix or breaking change
# it bumps the version files, writes CHANGELOG.md, commits that as
# "chore(release): vX.Y.Z [skip ci]", tags vX.Y.Z and creates the GitHub
# release; publish then builds that tag with SourceMod 1.12 (stable) and adds
# the packages to the release. A manual run or a pull request (e.g. from
# Dependabot) builds without publishing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sourcemod: ['1.12', '1.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - name: install SourceMod ${{ matrix.sourcemod }}
        run: |
          # latest build of the branch, e.g. sourcemod-1.12.0-git7210-linux.tar.gz
          sm_file=$(curl -fsSL "https://sm.alliedmods.net/smdrop/${{ matrix.sourcemod }}/sourcemod-latest-linux")
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -fsSL "https://sm.alliedmods.net/smdrop/${{ matrix.sourcemod }}/$sm_file" | tar -xz -C "$RUNNER_TEMP/sourcemod"
          scripting="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
          if [ -x "$scripting/spcomp64" ]; then spcomp="$scripting/spcomp64"; else spcomp="$scripting/spcomp"; fi
          echo "using $sm_file ($spcomp)"
          echo "SPCOMP=$spcomp" >> "$GITHUB_ENV"
          echo "SM_INCLUDE=$scripting/include" >> "$GITHUB_ENV"
      - name: make package
        run: make package SPCOMP="$SPCOMP" SM_INCLUDE="$SM_INCLUDE"
      - uses: actions/upload-artifact@v7
        if: matrix.sourcemod == '1.12'
        with:
          name: gamewe-sourcemod
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0 # tags, for the version
      - name: install SourceMod 1.12
        run: |
          sm_file=$(curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/sourcemod-latest-linux")
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/$sm_file" | tar -xz -C "$RUNNER_TEMP/sourcemod"
          scripting="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
          if [ -x "$scripting/spcomp64" ]; then spcomp="$scripting/spcomp64"; else spcomp="$scripting/spcomp"; fi
          echo "SPCOMP=$spcomp" >> "$GITHUB_ENV"
          echo "SM_INCLUDE=$scripting/include" >> "$GITHUB_ENV"
      - name: make package
        run: make package SPCOMP="$SPCOMP" SM_INCLUDE="$SM_INCLUDE"
      - name: add the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$RELEASE" dist/*.tar.gz dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY"
