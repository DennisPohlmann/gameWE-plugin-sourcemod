name: Bug report
description: Something in gameWE - SourceMod plugin does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security problems do not
        belong here**: please report them privately as described in
        [SECURITY.md](https://github.com/DennisPohlmann/gameWE-plugin-sourcemod/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: "The version of gameWE - SourceMod plugin you use (`sm plugins info gamewe`, e.g. 0.4.0)."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Game server"
      placeholder: "game (CS:S, CS:GO, ...), SourceMod and Metamod:Source versions, OS"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Which game is affected, if any.
      placeholder: e.g. CS 1.6, CS:S, CS:GO, CS2
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: "Server console output and `addons/sourcemod/logs/errors_*.log`."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed passwords, RCON passwords, tokens and other private data from the logs and configs above.
          required: true
